<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004225"/>
      <stop offset="50%" style="stop-color:#1b4332"/>
      <stop offset="100%" style="stop-color:#2d6a4f"/>
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#40916c"/>
      <stop offset="100%" style="stop-color:#52b788"/>
    </linearGradient>
  </defs>
  
  <!-- Main Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" opacity="0.95"/>
  
  <!-- Inner glow -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  
  <!-- Bloom / Flower Symbol -->
  <g transform="translate(50,50)">
    <!-- Center -->
    <circle cx="0" cy="0" r="8" fill="white" opacity="0.95"/>
    
    <!-- Petals -->
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="white" opacity="0.9"/>
    <ellipse cx="17" cy="-6" rx="8" ry="14" fill="white" opacity="0.85" transform="rotate(72)"/>
    <ellipse cx="10" cy="15" rx="8" ry="14" fill="white" opacity="0.8" transform="rotate(144)"/>
    <ellipse cx="-10" cy="15" rx="8" ry="14" fill="white" opacity="0.8" transform="rotate(-144)"/>
    <ellipse cx="-17" cy="-6" rx="8" ry="14" fill="white" opacity="0.85" transform="rotate(-72)"/>
    
    <!-- Leaf accents -->
    <path d="M-25,20 Q-15,25 -5,15" stroke="url(#leafGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M25,20 Q15,25 5,15" stroke="url(#leafGradient)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
